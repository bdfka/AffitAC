<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — AffitAC</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container" style="max-width:420px; margin-top:100px;">
        <div class="card">
            <h2>Регистрация</h2>
            <p class="muted" style="margin-bottom:20px;">Создайте новый аккаунт</p>
            <input type="text" id="username" placeholder="Никнейм">
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Пароль (мин. 6 символов)">
            <button class="btn btn-primary" style="width:100%;" onclick="register()">Создать аккаунт</button>
            <p style="margin-top:16px; text-align:center;" class="muted">
                Уже есть аккаунт? <a href="login.html" class="link">Вход</a>
            </p>
            <p style="text-align:center; margin-top:8px;">
                <a href="index.html" class="link" style="font-size:0.9rem;">← На главную</a>
            </p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script>
        async function register() {
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!username || !email || !password) { alert('Заполните все поля'); return; }
            if (password.length < 6) { alert('Пароль должен быть не менее 6 символов'); return; }

            const { data, error } = await db.auth.signUp({
                email, password,
                options: { data: { username } }
            });

            if (error) { alert('Ошибка: ' + error.message); return; }
            alert('Аккаунт создан! Проверьте почту для подтверждения.');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
